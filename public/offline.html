<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Project Atlas</title>
  <style>
    body {
      background-color: #1f1f1f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background-color: #242424;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 48px;
      color: #b45df0;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      color: #c4bfd0;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .notice {
      background: rgba(126, 10, 194, 0.15);
      border: 1px solid rgba(180, 93, 240, 0.3);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: #e2d9f3;
      margin-bottom: 24px;
    }
    button {
      background-color: #7e0ac2;
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 12px 28px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #9a13e6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>Connection Paused</h1>
    <p>You appear to be offline or experiencing connection instability.</p>
    <div class="notice">
      <strong>Security Policy:</strong> Real-money wagering, wallet updates, and game participation cannot take place offline. Authoritative server verification is required.
    </div>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
